name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: banquito_solidario
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci --ignore-scripts || npm install --ignore-scripts

      - name: Generar cliente Prisma
        run: npm run db:generate -w backend
        env:
          DATABASE_URL: 'mysql://root:root@localhost:3306/banquito_solidario'

      - name: Tipos (backend)
        run: npm run build -w backend

      - name: Tipos y build (frontend)
        run: npm run build -w frontend

      - name: Lint (backend)
        run: npm run lint -w backend

      - name: Lint (frontend)
        run: npm run lint -w frontend

      - name: Tests (backend)
        run: npm test -w backend

      - name: Tests (frontend)
        run: npm test -w frontend
